# colibri local inference fleet — primary node config
#
# This is the config for the LOCAL PRIMARY (this HX370 box): GLM-5.2-colibri
# as the heavy hitter, with the HOT RAM + SSD KV cache tiers. Smaller helper
# models (fine-tuned off opencode traces) run on OTHER devices and are reached
# through the [helper] endpoints below. opencode fans tasks to GLM vs helper.
#
# Edit the values, then launch with:  scripts/colibri-serve configs/colibri.toml
# or the fleet CLI:  glm opencode | glm hermes | glm proxy | glm tiny-<name>
#
# !! PRE-PRODUCTION / DISARMED BY DEFAULT !!
# Live actions (serve a model, run the proxy, fan out via the harness, send chat
# traffic, fine-tune) will NOT run until you explicitly arm the fleet:
#     export COLI_LIVE=1
# Run `glm doctor` first to validate the config end-to-end. See docs/FLEET-STATUS.md.

[primary]
# GLM-5.2-colibri int4+int8-MTP snapshot (reads from SNAP env inside gli)
model = "/media/scott/SSD_4TB/models-fast/GLM-5.2-colibri-int4-with-int8-mtp"
model_id = "glm-5.2-colibri"
# OpenAI-compatible listen address/port for this node
host = "127.0.0.1"
port = 8100
api_key = "local-glm52"

# Generation / memory profile for the 744B on 96 GB RAM
ram_gb = 67          # expert cache budget (rest auto for dense/attn)
ngen = 1024          # safety cap on generated tokens
kv_slots = 4         # parallel conversation slots (each = one KV slot)
max_queue = 8
queue_timeout = 300

[cache]
# Global hash-keyed KV cache DB on the fast SSD (shared across processes).
enabled = true
# In-process HOT RAM tier in front of the SSD store. Holds the system prompts
# we hotswap between sessions so a new conversation is a memcpy, not a prefill.
# 0.5 GB ~ hundreds of prompts; raise if you keep many distinct system prompts.
hot_gb = 0.5
# Normalize volatile tokens (timestamp/date/cwd/path/key=value) before hashing
# so the cache hits across sessions even when opencode injects a fresh timestamp.
normalize = true
# Directory of static system-prompt files (.json/.md/.txt/.yaml/.yml) to
# prewarm into HOT+SSD at startup. Matches the exact prompt opencode sends,
# so the FIRST request of every session is free. Leave "" to skip prewarming.
prime_dir = ""

[helper]
# Smaller fine-tuned LM (trained on opencode traces) running on ANOTHER device.
# opencode / the glm proxy route cheap/high-frequency turns (classify, route,
# tool-shaping, scratch) here; GLM-5.2 handles the heavy reasoning/codegen.
enabled = true
base_url = "http://helper-device.local:8100/v1"
api_key = "helper-local"
model_id = "hermes-helper-finetune"

[proxy]
# glm proxy: a local OpenAI-compatible front door that auto-routes each request
# to GLM (primary) or the helper based on an estimated token budget. Point
# opencode at the proxy port instead of GLM directly to get transparent routing.
enabled = true
host = "127.0.0.1"
port = 8200
api_key = "local-glm52"
# Tasks with an estimated token cost at or below this go to the helper; above
# it, to GLM. Cheap classify/route/format -> helper; long reasoning -> GLM.
route_max_tokens = 256
# When routing to the helper, rewrite the model id to the helper's model_id
# (the helper may not accept "glm-5.2-colibri"). Set false to pass through as-is.
rewrite_model_id = true
# Hardening: cap request body size (rejects > N bytes with 413) and trip a
# circuit breaker returning 503 after N consecutive upstream failures.
max_body_bytes = 8388608          # 8 MiB
breaker_failures = 5              # open circuit after this many failures
breaker_cooldown_s = 30           # keep it open this long before retrying

# Example small-model harness. `tiny-example` is proxy-only for now (remote);
# `tiny.coder` is a LOCAL, trainable example that drives the auto-finetune
# pipeline (extract -> clean -> format -> train on opencode traces).
[tiny.example]
# model = "/path/to/small-finetune"   # local -> served via colibri-serve
base_url = "http://helper-device.local:8300/v1"   # remote -> proxy only for now
model_id = "tiny-example"
host = "127.0.0.1"
port = 8300
api_key = "local"

# Trainable local harness. Fine-tune from a small base on opencode traces:
#   tiny-harness coder train --plan          # show resolved plan
#   tiny-harness coder train                 # prep (extract/clean/format) + dry-run train
#   tiny-harness coder train --run           # prep + REAL QLoRA training (GPU box)
#   tiny-harness coder serve                 # serve the resulting checkpoint
#   tiny-harness coder eval --live           # score held-out traces vs reference
[tiny.coder]
# model = "/media/scott/SSD_4TB/finetune-staging/outputs/checkpoints/tiny-coder"
model_id = "tiny-coder"
host = "127.0.0.1"
port = 8310
api_key = "local"
# training: drives the auto-finetune repo (default path below)
train_repo   = "/home/scott/git/auto-finetune"
train_base   = "/media/scott/SSD_4TB/models-fast/RefinedNeuro/RefinedToolCallV5-3b"
train_output = "/media/scott/SSD_4TB/finetune-staging/outputs/checkpoints/tiny-coder"
train_epochs = 2
train_source = "opencode"   # opencode | hermes | null(merged)
# optional per-subagent overrides (else inherited from auto-finetune config.yaml):
# train_backend = "peft"     # auto | unsloth | peft
# lora_r = 16; lora_alpha = 32; max_seq_length = 8192
# system_prompt = ""         # override the format template's system prompt

# Hermes adapter: how Hermes-agent should talk to our helper endpoint.
# Hermes speaks OpenAI-compatible via provider:"custom" + base_url. `glm hermes
# config` emits the [model] block to drop into Hermes' cli-config.yaml (or
# ~/.hermes/cli-config.yaml) so Hermes routes through the helper.
[hermes]
helper = "hermes-helper-finetune"   # the [helper] model_id Hermes should request
# adapter block reused by `glm hermes config`:
adapter_base_url = "http://helper-device.local:8100/v1"
adapter_api_key = "helper-local"

# Tier-3 self-contained harness: a small orchestrator LM that fans out subtasks
# to subagents (each a tiny.<name> endpoint). `glm harness` runs the loop.
[harness]
enabled = true
# orchestrator endpoint (a small LM; can be the helper or a dedicated one)
base_url = "http://helper-device.local:8100/v1"
api_key = "helper-local"
model_id = "harness-orchestrator"
# subagents fanned out in parallel (each must have a [tiny.<name>] section)
subagents = ["example"]
max_subtasks = 8
